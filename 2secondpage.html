<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login Form</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body, html {
    height: 100%;
    background: linear-gradient(to right, #467885, #0d3c75);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 20px;
    overflow: hidden;
  }

  /* Navbar */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    background-color: #333;
    padding: 8px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    z-index: 1000;
    font-size: 14px;
  }

  .logo {
    color: white;
    font-size: 18px;
    font-weight: bold;
  }

  ul.nav-links {
    list-style: none;
    display: flex;
    gap: 15px;
  }

  ul.nav-links li a {
    color: white;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.3s ease;
  }

  ul.nav-links li a:hover {
    color: aqua;
  }

  /* Container for form and heading */
  .container {
    margin-top: 60px; /* space for navbar */
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  h1 {
    color: white;
    margin-bottom: 20px;
    font-size: 22px;
  }

  form {
    background-color: rgb(48, 44, 44);
    padding: 25px 30px;
    border-radius: 15px;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  label {
    font-size: 16px;
    color: white;
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="password"] {
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    margin-bottom: 18px;
    font-size: 15px;
  }

  button {
    background-color: aqua;
    color: black;
    font-weight: 600;
    padding: 12px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    margin-bottom: 12px;
    transition: background-color 0.3s ease;
  }

  button:hover {
    background-color: #00d2ff;
  }

  a.register_button {
    color: white;
    text-align: center;
    font-size: 15px;
    text-decoration: none;
    padding: 10px 0;
    border-radius: 12px;
    background-color: transparent;
    border: 2px solid aqua;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  a.register_button:hover {
    color: #0072ff;
    background-color: aqua;
  }

  #error-message {
    color: #ff6961;
    margin-bottom: 15px;
    font-weight: 600;
    min-height: 20px;
  }

  @media (max-width: 400px) {
    form {
      max-width: 100%;
      padding: 20px;
    }
    nav {
      font-size: 12px;
      padding: 6px 15px;
    }
    .logo {
      font-size: 16px;
    }
    ul.nav-links {
      gap: 10px;
    }
  }
</style>
</head>

<body>
  <nav>
    <div class="logo">QuickMedic</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="#">Contact us</a></li>
      <li><a href="#">About us</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1>Login Form</h1>

    <!-- Optional place for server-side error messages -->
    <div id="error-message"></div>

    <form method="post" action="login.php" enctype="multipart/form-data" onsubmit="return validate(event)">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" required>

      <label for="password">Password</label>
      <input type="password" name="password" id="password" required>

      <button type="submit">Login</button>
      <a href="3thirdregisterform.html" class="register_button">Register</a>
    </form>
  </div>

  <script>
    function validate(event) {
      let username = document.getElementById("username").value.trim();
      let password = document.getElementById("password").value.trim();

      if (!username || !password) {
        alert("Please enter both username and password.");
        event.preventDefault();
        return false;
      }
      return true;
    }
  </script>
</body>

</html>
